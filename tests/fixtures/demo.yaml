# Disposable test fixtures for the k3s test cluster. Never apply to a real cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: k8sc-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8sc-demo
data:
  greeting: hello from k8sconsole
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: k8sc-demo
type: Opaque
stringData:
  password: s3cr3t-test-value
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8sc-demo
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          envFrom:
            - configMapRef:
                name: app-config
          command: ['sh', '-c']
          args:
            - |
              mkdir -p /www && echo "k8sc-web-ok" > /www/index.html
              httpd -f -p 8080 -h /www &
              i=0; while true; do echo "tick $i from $(hostname)"; i=$((i+1)); sleep 2; done
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8sc-demo
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: k8sc-demo
spec:
  rules:
    - host: web.k8sc.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: k8sc-demo
spec:
  schedule: '0 3 * * *'
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: job
              image: busybox:1.36
              command: ['sh', '-c', 'echo cron-job-ran']
---
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  namespace: k8sc-demo
spec:
  restartPolicy: Always
  containers:
    - name: crash
      image: busybox:1.36
      command: ['sh', '-c', 'echo about-to-crash; exit 3']
