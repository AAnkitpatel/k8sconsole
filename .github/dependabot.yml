version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      codemirror:
        patterns: ["@codemirror/*", "codemirror"]
      lint-and-types:
        patterns: ["eslint*", "@eslint/*", "typescript*", "@types/*", "globals"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
